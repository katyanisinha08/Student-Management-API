<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Management System</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* बैकग्राउंड स्लाइडशो और फुल स्क्रीन लेआउट */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* बैकग्राउंड स्लाइड्स और एनिमेशन */
        .bg-slideshow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            animation: fadeInOut 18s infinite;
        }

        /* पहली स्लाइड: आपके कॉलेज (SATI) की ऑरिजिनल तस्वीर (college.jpg नाम से)[span_0](start_span)[span_0](end_span) */
        .bg-slide:nth-child(1) {
            background-image: url('college.jpg');
            animation-delay: 0s;
        }
        /* दूसरी स्लाइड: क्लासरूम */
        .bg-slide:nth-child(2) {
            background-image: url('https://images.unsplash.com/photo-1562774053-701939374585?q=80&w=1920&auto=format&fit=crop');
            animation-delay: 6s;
        }
        /* तीसरी स्लाइड: स्टूडेंट्स */
        .bg-slide:nth-child(3) {
            background-image: url('https://images.unsplash.com/photo-1524178232363-1fb2b075b655?q=80&w=1920&auto=format&fit=crop');
            animation-delay: 12s;
        }

        /* धीरे-धीरे बदलने का इफेक्ट (Fade In / Out) */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(1.05); }
            10% { opacity: 1; transform: scale(1); }
            33% { opacity: 1; transform: scale(1); }
            43% { opacity: 0; transform: scale(1.05); }
            100% { opacity: 0; }
        }

        /* डार्क ओवरले ताकि लॉगिन फॉर्म साफ दिखे */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            width: 380px;
            z-index: 1;
        }
        .login-card h2 {
            margin-bottom: 20px;
            color: #2e7d32;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-login:hover {
            background-color: #1b5e20;
        }
        .error-msg {
            color: #dc3545;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <!-- बैकग्राउंड स्लाइडशो जिसमें पहली इमेज आपके कॉलेज की है[span_1](start_span)[span_1](end_span) -->
    <div class="bg-slideshow">
        <div class="bg-slide"></div>
        <div class="bg-slide"></div>
        <div class="bg-slide"></div>
    </div>
    <div class="overlay"></div>

    <div class="login-card">
        <h2>🎓 User Login</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="login-name" required placeholder="उदा: Rahul">
            </div>
            <div class="form-group">
                <label>Role</label>
                <select id="login-role" required>
                    <option value="">-- रोल चुनें --</option>
                    <option value="admin">Admin</option>
                    <option value="superadmin">Super Admin</option>
                </select>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="login-email" required placeholder="rahul29@college.admin.sati.in">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" required placeholder="ra29coad01">
            </div>
            <button type="submit" class="btn-login">Login</button>
            <div id="error-container" class="error-msg"></div>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const errorContainer = document.getElementById('error-container');

        // नाम को Title Case में बदलने का फंक्शन
        function formatNameToTitleCase(name) {
            return name.trim().split(/\s+/)
                .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
                .join(' ');
        }

        if (loginForm) {
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                errorContainer.innerText = '';

                let rawName = document.getElementById('login-name').value.trim();
                let selectedRole = document.getElementById('login-role').value;
                let email = document.getElementById('login-email').value.trim().toLowerCase();
                let password = document.getElementById('login-password').value.trim();

                // 1. नाम का वैलिडेशन
                if (rawName.length < 3 || !/^[A-Za-z\s]+$/.test(rawName)) {
                    errorCardText = 'अमान्य नाम! नाम कम से कम 3 अक्षरों का होना चाहिए।';
                    errorContainer.innerText = errorCardText;
                    return;
                }

                const formattedName = formatNameToTitleCase(rawName);
                const firstName = formattedName.split(' ')[0].toLowerCase();
                const firstTwoChars = firstName.slice(0, 2);

                // 2. ईमेल वैलिडेशन: [firstname]29@college.[role].sati.in
                const expectedEmail = `${firstName}29@college.${selectedRole}.sati.in`;

                if (email !== expectedEmail) {
                    errorContainer.innerText = `लॉगिन विफल! सही ईमेल यह होना चाहिए:\n${expectedEmail}`;
                    return;
                }

                // 3. पासवर्ड वैलिडेशन: [नाम के पहले 2 अक्षर] + 29 + co + [ad/su] + 01
                const roleCode = selectedRole === 'superadmin' ? 'su' : 'ad';
                const safePasswordCheck = `${firstTwoChars}29co${roleCode}01`.toLowerCase();

                if (password.toLowerCase() !== safePasswordCheck) {
                    errorContainer.innerText = `लॉगिन विफल! पासवर्ड गलत है。\nहिंट: आपके नाम के पहले 2 अक्षर से शुरू होकर 29co${roleCode}01 पर समाप्त होना चाहिए।`;
                    return;
                }

                // लोकल स्टोरेज में सेव करें और आगे भेजें
                localStorage.setItem('loggedInUser', `${formattedName} (${selectedRole.toUpperCase()})`);

                alert('सफलतापूर्वक लॉगिन हो गया!');
                window.location.href = 'index.html';
            });
        }
    </script>
</body>
</html>
